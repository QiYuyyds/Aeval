name: aeval-starter
description: 内置示例套件 — 随 wheel 分发, 确定性判据, 全程离线 (eval-suite run demo)
version: 1.0.0
metadata:
  purpose: zero-setup first run for pip users

tasks:
  - id: echo-qa
    description: Mock Agent 回答中包含回应文本 — 验证基本执行与评分链路
    prompt: What files are in the workspace?
    max_trials: 2
    graders:
      - type: code
        name: code_based
        config:
          checks:
            - type: contains
              target: transcript
              value: "Mock response"

  - id: artifact-check
    description: Mock Agent 成功时产出 code_file 产物 — 验证产物类检查
    prompt: Please create a small Python module.
    max_trials: 2
    graders:
      - type: artifact
        name: artifact_check
        config:
          expected_type: "code_file"
