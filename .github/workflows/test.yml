# Aeval CI — test + lint + dashboard build.
#
# Runs on every push to main and on every PR:
#   - python-tests: pytest + ruff for packages/agent-eval (Python 3.11 / 3.12)
#   - dashboard-build: pnpm production build for apps/dashboard

name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/agent-eval[api,cli,dev]"
      - name: Lint (ruff)
        run: |
          ruff check packages/agent-eval
          ruff check examples --config packages/agent-eval/pyproject.toml
      - name: Run tests
        run: |
          cd packages/agent-eval
          pytest tests/ -q --cov=agent_eval --cov-report=term-missing
      - name: Statistics coverage floor (docs/architecture.md §8, ≥90%)
        run: |
          cd packages/agent-eval
          pytest tests/ -q --cov=agent_eval.core.metrics --cov-report=term --cov-fail-under=90

  dashboard-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build dashboard
        run: pnpm --filter eval-dashboard build

  python-tests-windows:
    # 观察车道 (continue-on-error): Windows 上 asyncio/SQLite/路径的行为差异
    # 先亮红不挡合并; 稳定后转为阻塞门禁 (ubuntu 车道已是阻塞)。
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/agent-eval[api,cli,dev]"
      - name: Run tests
        run: |
          cd packages/agent-eval
          pytest tests/ -q
